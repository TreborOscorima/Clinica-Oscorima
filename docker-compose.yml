# =============================================================================
# docker-compose.yml — WaykiSAC Clínica producción
#
# Stack 100% independiente de Sistema-de-Ventas y TUWAYKIFOOD — DB, red y
# proceso propios. Misma mecánica de arranque que esos dos sistemas.
#
# PRIMERA VEZ:
#   1. cp .env.example .env && editar (MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD, SECRET_KEY)
#   2. Crear red NPM si no existe: docker network create nginx-proxy-manager_default
#   3. bash scripts/deploy-prod.sh
#
# NPM (Proxy Host):
#   Domain: life.tuwayki.app | Forward: tuwayki_life:3000 | WebSockets ON
#
# Uso normal: bash scripts/deploy-prod.sh
# Para local: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# =============================================================================

# Nombre de proyecto fijo (independiente de la carpeta local) — TUWAYKILIFE.
name: sistema-para-clinicas

services:
  life_mysql:
    image: mysql:8.0
    container_name: life_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerido en .env}
      MYSQL_DATABASE: ${MYSQL_DB:-life_db}
      MYSQL_USER: ${MYSQL_USER:-clinica}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requerido en .env}
    volumes:
      - life_mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max_connections=100
      - --innodb_buffer_pool_size=128M
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h localhost -u root -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - life_internal

  tuwayki_life:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuwayki_life:latest
    container_name: tuwayki_life
    restart: on-failure:10
    depends_on:
      life_mysql:
        condition: service_healthy
    ports:
      - "3004:3000"
    env_file:
      - .env
    environment:
      ENV: prod
      MYSQL_HOST: life_mysql
      MYSQL_PORT: "3306"
      FRONTEND_PORT: "3000"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://life.tuwayki.app}
      REPORT_EXPORT_DIR: /app/exports
      # Registro público (/api/registro): trial y rate-limit del core.
      # Un solo contenedor de app → el fallback en memoria es seguro.
      LIFE_TRIAL_DAYS: ${LIFE_TRIAL_DAYS:-15}
      ALLOW_MEMORY_RATE_LIMIT_FALLBACK: "1"
    volumes:
      - life_web:/app/.web
      - life_exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - life_internal
      - life_npm_network

volumes:
  life_mysql_data:
  life_web:
  life_exports:

networks:
  life_internal:
    driver: bridge

  life_npm_network:
    external: true
    name: nginx-proxy-manager_default
