<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clínica Estética - Gestión</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-symbol">WS</div>
          <div class="brand-text">
            <span class="brand-title">Clínica Estética</span>
            <span class="brand-subtitle">WAYKI SAC</span>
          </div>
        </div>
        <nav class="nav">
          <div class="nav-group">
            <a class="nav-item is-active" href="#" data-route="dashboard">
              <span class="nav-icon" aria-hidden="true">🏠</span>
              <span class="nav-label">Dashboard</span>
            </a>
            <a class="nav-item" href="#" data-route="turnos">
              <span class="nav-icon" aria-hidden="true">🗓️</span>
              <span class="nav-label">Turnos</span>
            </a>
            <a class="nav-item" href="#" data-route="caja">
              <span class="nav-icon" aria-hidden="true">💳</span>
              <span class="nav-label">Caja &amp; Facturación</span>
            </a>
            <a class="nav-item" href="#" data-route="pacientes">
              <span class="nav-icon" aria-hidden="true">🧑‍⚕️</span>
              <span class="nav-label">Pacientes</span>
            </a>
            <a class="nav-item" href="#" data-route="profesionales">
              <span class="nav-icon" aria-hidden="true">👥</span>
              <span class="nav-label">Profesionales</span>
            </a>
            <a class="nav-item" href="#" data-route="inventario">
              <span class="nav-icon" aria-hidden="true">📦</span>
              <span class="nav-label">Inventario</span>
            </a>
            <a class="nav-item" href="#" data-route="servicios">
              <span class="nav-icon" aria-hidden="true">🧾</span>
              <span class="nav-label">Servicios</span>
            </a>
            <a class="nav-item" href="#" data-route="reportes">
              <span class="nav-icon" aria-hidden="true">📊</span>
              <span class="nav-label">Reportes</span>
            </a>
          </div>
          <div class="nav-group nav-group--footer">
            <a class="nav-item" href="#" id="logout">
              <span class="nav-icon" aria-hidden="true">🚪</span>
              <span class="nav-label">Cerrar sesión</span>
            </a>
          </div>
        </nav>
      </aside>
      <main class="content">
        <section id="login-view" class="card card--auth">
          <header class="card-header">
            <h2>Ingresar</h2>
            <p class="card-subtitle">Accede con tus credenciales para continuar</p>
          </header>
          <form id="login-form" class="form">
            <div class="form-row">
              <label for="login-email">Email</label>
              <input
                id="login-email"
                type="email"
                placeholder="admin@clinic.local"
                required
              />
            </div>
            <div class="form-row">
              <label for="login-pass">Contraseña</label>
              <input
                id="login-pass"
                type="password"
                placeholder="Admin123!"
                required
              />
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" id="btn-login" type="submit">Entrar</button>
              <button class="btn btn-secondary" type="reset">Limpiar</button>
            </div>
          </form>
          <div id="login-msg" class="muted"></div>
        </section>

        <section id="router-view" class="card" style="display: none">
          <header class="card-header">
            <h2 id="route-title">Dashboard</h2>
          </header>
          <div id="route-content"></div>
        </section>
      </main>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/modules/pacientes.js"></script>
    <script src="/static/js/modules/turnos.js"></script>
    <script src="/static/js/modules/servicios.js"></script>
    <script src="/static/js/modules/profesionales.js"></script>
    <script src="/static/js/modules/caja.js"></script>
    <script src="/static/js/modules/inventario.js"></script>
    <script src="/static/js/modules/reportes.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
