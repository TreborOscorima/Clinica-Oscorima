name: CI

on:
  push:
    branches: [main, docker-deploy-prod]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (pines exactos)
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Create minimal .env for rxconfig
        run: |
          cat > .env <<'EOF'
          ENV=test
          MYSQL_HOST=localhost
          MYSQL_PORT=3306
          MYSQL_USER=test
          MYSQL_PASSWORD=test
          MYSQL_DB=test
          AUTH_SECRET_KEY=ci-test-key-not-for-production-32ch
          EOF

      - name: Lint (ruff — modo suave, ver ruff.toml)
        run: ruff check .

      - name: Syntax check all Python files
        run: python -m compileall -q clinica_app tests

      - name: Run tests
        run: pytest tests/ -v --tb=short
